version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - fraud-network
    healthcheck:
      test: echo stat | nc zookeeper 2181 || exit 0
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - fraud-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 0
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - fraud-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    hostname: neo4j
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - fraud-network
    healthcheck:
      test: cypher-shell -u neo4j -p password "RETURN 1" || exit 0
      interval: 10s
      timeout: 10s
      retries: 5

  data-generator:
    build:
      context: ./services/generator
      dockerfile: Dockerfile
    hostname: data-generator
    container_name: data-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      TRANSACTION_RATE: 20
      FRAUD_INJECTION_RATE: 0.05
      NUM_ACCOUNTS: 1000
      FRAUD_TYPES: '["GAT", "DMR", "RBF", "CAL", "AEV"]'
    depends_on:
      - kafka
      - redis
    networks:
      - fraud-network
    restart: on-failure

  anomaly-detector:
    build:
      context: ./services/detector
      dockerfile: Dockerfile
    hostname: anomaly-detector
    container_name: anomaly-detector
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379
      VAE_MODEL_PATH: /models/vae/model.pt
      DRIFT_THRESHOLD_PERCENTILE: 90
    depends_on:
      - kafka
      - redis
    volumes:
      - ./models:/models
    networks:
      - fraud-network
    restart: on-failure

  graph-analyzer:
    build:
      context: ./services/graph-analyzer
      dockerfile: Dockerfile
    hostname: graph-analyzer
    container_name: graph-analyzer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379
      CLUSTERING_INTERVAL: 15
    depends_on:
      - kafka
      - neo4j
      - redis
    networks:
      - fraud-network
    restart: on-failure

  api-server:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    hostname: api-server
    container_name: api-server
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - redis
      - neo4j
      - kafka
    networks:
      - fraud-network
    restart: on-failure

  dashboard:
    build:
      context: ./services/dashboard
      dockerfile: Dockerfile
    hostname: dashboard
    container_name: dashboard
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WS_URL: http://localhost:8000
    depends_on:
      - api-server
    networks:
      - fraud-network
    restart: on-failure

volumes:
  redis-data:
  neo4j-data:
  neo4j-logs:

networks:
  fraud-network:
    driver: bridge
